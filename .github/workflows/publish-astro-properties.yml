name: Publish @davidsneighbour/astro-properties

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "JSON.parse(require('fs').readFileSync('packages/astro-properties/package.json', 'utf8')).version")"

          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag/version mismatch:"
            echo "  pushed tag:       ${tag}"
            echo "  package version:  ${version}"
            exit 1
          fi

      - name: Run tests
        run: npm run test:coverage --workspace packages/astro-properties

      - name: Publish package
        working-directory: packages/astro-properties
        run: npm publish
